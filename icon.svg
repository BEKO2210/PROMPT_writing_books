<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ab4f8"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="260" cy="260" r="180" fill="#8ab4f8" opacity=".04"/>
  <!-- Accent line left -->
  <rect x="100" y="100" width="5" height="312" rx="2.5" fill="url(#glow)" opacity=".6"/>
  <!-- B letter - bold serif, elegant -->
  <text x="270" y="372" font-family="'Georgia','Palatino Linotype','Book Antiqua',serif" font-size="340" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-8">B</text>
  <!-- Accent underline -->
  <rect x="148" y="404" width="200" height="4" rx="2" fill="url(#glow)" opacity=".5"/>
  <!-- Small decorative dot -->
  <circle cx="396" cy="116" r="12" fill="url(#glow)" opacity=".4"/>
</svg>
